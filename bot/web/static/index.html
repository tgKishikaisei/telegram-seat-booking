<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Афиша и места</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <p class="venue" id="venue">Камерный зал</p>
    <nav class="top-actions" aria-label="Разделы">
      <button type="button" class="link" id="nav-tickets">Мои билеты</button>
      <button type="button" class="link" id="nav-scan" hidden>Проверка билетов</button>
    </nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <template id="tpl-show">
    <button type="button" class="show">
      <span class="show-when"><span class="show-date"></span><span class="show-time"></span></span>
      <span class="show-body">
        <span class="show-title"></span>
        <span class="show-desc"></span>
      </span>
      <span class="show-free"></span>
    </button>
  </template>
</body>
</html>
